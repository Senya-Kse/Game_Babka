<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дед алкоголик против бабки Палестинки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="menu" class="overlay">
            <h1>Дед алкоголик<br>против бабки Палестинки</h1>
            <p class="hint">Тапай по экрану или жми ПРОБЕЛ, чтобы прыгать</p>
            <button id="startBtn">НАЧАТЬ ПОБЕГ</button>
            <p class="small">Музыка: включить звук 🔇 → 🔊</p>
        </div>

        <div id="gameOver" class="overlay hidden">
            <h2>Дед догнал бабку! 🪵</h2>
            <p>Очки: <span id="finalScore">0</span></p>
            <p>Рекорд: <span id="bestScore">0</span></p>
            <button id="restartBtn">ЕЩЁ РАЗ</button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <!-- Положи сюда файл music.mp3 в папку assets -->
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <script src="game.js"></script>
</body>
</html>
